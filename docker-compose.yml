services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moziboard-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=moziboard
      - DB_PASSWORD=moziboard_secret
      - DB_NAME=moziboard
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=moziboard_redis_secret
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
      - OPENCLAW_CLI_PATH=/root/.npm-global/bin/openclaw
      - OPENCLAW_GATEWAY_URL=http://host.docker.internal:18789/v1/chat/completions
      - OPENCLAW_GATEWAY_TOKEN=a5a3e43e5ef31b7a2fa8e073fbcf562ba35fd25d73599614
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ${HOME}/.openclaw:/root/.openclaw
      - ${HOME}/.npm-global:/root/.npm-global
      - ${HOME}/.ssh/id_ed25519_moziboard:/root/.ssh/id_rsa:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moziboard-frontend
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: moziboard-db
    environment:
      - POSTGRES_USER=moziboard
      - POSTGRES_PASSWORD=moziboard_secret
      - POSTGRES_DB=moziboard
    # ports:
    #   - "5435:5432"  # Uncomment for local dev access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moziboard-redis
    command: redis-server --appendonly yes --requirepass moziboard_redis_secret
    # ports:
    #   - "6379:6379"  # Uncomment for local dev access
    volumes:
      - redis_data:/data
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: moziboard-db-ui
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - db
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: moziboard-mcp
    ports:
      - "3005:3005"
    environment:
      - API_URL=http://moziboard-backend:8080/api
    env_file:
      - ./mcp-server/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  cloudbeaver_data:
